# Render blueprint: one web service that serves both the API and the built
# frontend, plus Postgres and a Redis-compatible cache.
services:
  - type: web
    name: flowforge
    runtime: node
    plan: free
    buildCommand: >-
      cd client && npm install --include=dev && VITE_API_URL=/api npm run build &&
      cd ../server && npm install && npx prisma generate
    startCommand: cd server && npx prisma migrate deploy && node index.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flowforge-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  - type: keyvalue
    name: flowforge-cache
    plan: free
    ipAllowList: []

databases:
  - name: flowforge-db
    plan: free
